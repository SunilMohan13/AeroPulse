name: aeropulse

networks:
  aeropulse-frontend:
  aeropulse-backend:

volumes:
  timescale-data:
  redpanda-data:
  redis-data:
  minio-data:

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeropulse
      POSTGRES_PASSWORD: aeropulse
      POSTGRES_DB: aeropulse
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ../db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ../db/migrations/0002_phase3.sql:/docker-entrypoint-initdb.d/0002_phase3.sql:ro
      - ../db/migrations/0003_phase4.sql:/docker-entrypoint-initdb.d/0003_phase4.sql:ro
      - ../db/migrations/0004_raster_observation.sql:/docker-entrypoint-initdb.d/0004_raster_observation.sql:ro
      - ../db/migrations/0005_shadow_prediction.sql:/docker-entrypoint-initdb.d/0005_shadow_prediction.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeropulse -d aeropulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --schema-registry-addr
      - 0.0.0.0:8081
      - --smp
      - "1"
      - --memory
      - 512M
      - --mode
      - dev-container
      - --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:8081:8081"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  minio:
    image: quay.io/minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aeropulse
      MINIO_ROOT_PASSWORD: aeropulse_secret
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "aeropulse-api"]
    environment:
      AEROPULSE_SERVICE_NAME: aeropulse-api
      AEROPULSE_DATABASE_URL: postgresql://aeropulse:aeropulse@timescaledb:5432/aeropulse
      AEROPULSE_REDIS_URL: redis://redis:6379/0
      AEROPULSE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      AEROPULSE_MINIO_ENDPOINT: minio:9000
      AEROPULSE_JWT_SECRET: dev-only-change-me-use-32-bytes-min
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [aeropulse-frontend, aeropulse-backend]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 512m

  drift-monitor:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "aeropulse-drift-monitor"]
    environment:
      AEROPULSE_SERVICE_NAME: aeropulse-drift-monitor
      AEROPULSE_DATABASE_URL: postgresql://aeropulse:aeropulse@timescaledb:5432/aeropulse
      AEROPULSE_DRIFT_MONITOR_INTERVAL_SECONDS: 3600
      AEROPULSE_DRIFT_MONITOR_REFERENCE_HOURS: 168
      AEROPULSE_DRIFT_MONITOR_CURRENT_HOURS: 24
    depends_on:
      timescaledb:
        condition: service_healthy
    networks: [aeropulse-backend]
    mem_limit: 256m

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "aeropulse-worker"]
    environment:
      AEROPULSE_SERVICE_NAME: aeropulse-worker
      AEROPULSE_DATABASE_URL: postgresql://aeropulse:aeropulse@timescaledb:5432/aeropulse
      AEROPULSE_REDIS_URL: redis://redis:6379/0
      AEROPULSE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      timescaledb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks: [aeropulse-backend]
    mem_limit: 512m

  connector:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: "no"
    command: ["uv", "run", "aeropulse-connector"]
    environment:
      AEROPULSE_SERVICE_NAME: aeropulse-connector
      AEROPULSE_CONNECTOR_MODE: replay
      AEROPULSE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [aeropulse-backend]
    mem_limit: 256m

  web:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The browser runs on the host, so this is the host-published API port,
      # not the compose service name.
      VITE_API_BASE: http://127.0.0.1:8000
      # Bearer token for live mode, so the Live half of the Demo/Live toggle
      # is clickable straight out of `compose up` with no setup. This is a
      # VIEWER token signed with the dev HS256 secret that is itself in this
      # file (ADR-0003): it grants read access to a local stack and is not a
      # production credential. Anything deployed must override it and move to
      # OIDC. `AEROPULSE_WEB_TOKEN` and `AEROPULSE_UI_TOKEN` are both accepted
      # because the two halves of this work named it differently.
      VITE_API_TOKEN: ${AEROPULSE_WEB_TOKEN:-${AEROPULSE_UI_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZXJvcHVsc2Utd2ViLWRlbW8iLCJyb2xlcyI6WyJWSUVXRVIiXSwiaXNzIjoiYWVyb3B1bHNlIiwiaWF0IjoxNzg5NjY1MDIyLCJleHAiOjE4MjEyMDEwMjJ9.3cYobg5Mu2udoBJdAgvr4VhBbii2WcHafEkmk7ibwSA}}
      # Demo is the landing state: the scripted narrative is what the product
      # demonstrates, and it works with no backend at all. The toggle switches
      # to live.
      VITE_DEFAULT_DATA_MODE: ${AEROPULSE_UI_MODE:-demo}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks: [aeropulse-frontend]
    mem_limit: 1g
